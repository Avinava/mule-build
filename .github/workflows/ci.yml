name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['20.19.0', 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify types, tests, lint, and formatting
        run: |
          npm run build
          npm test
          npm run lint
          npm run format:check

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify installed package and MCP protocol
        if: matrix.node-version == '20.19.0'
        run: npm run test:package

      - name: Test CLI help
        run: |
          node dist/bin/mule-build.js --help
          node dist/bin/mule-build.js package --help
          node dist/bin/mule-build.js run --help
          node dist/bin/mule-build.js release --help
          node dist/bin/mule-build.js strip --help
          node dist/bin/mule-build.js enforce --help
          node dist/bin/mule-build.js doctor --help
          node dist/bin/mule-build.js status --help
          node dist/bin/mule-build.js stop --help
          node dist/bin/mule-build.js mcp --help

      - name: Test strip command (dry-run)
        run: |
          # Create a test XML file
          mkdir -p test-project/src/main/mule
          echo '<mule><http:request-config host="${secure::api.host}" /></mule>' > test-project/src/main/mule/global.xml

          # Run strip with dry-run
          node dist/bin/mule-build.js strip -d test-project/src/main/mule --dry-run

          # Verify file wasn't modified
          grep -q 'secure::' test-project/src/main/mule/global.xml

      - name: Test enforce command
        run: |
          # Create test files
          mkdir -p test-project2/src/main/mule
          echo '<mule><http:request-config password="${db.password}" /></mule>' > test-project2/src/main/mule/global.xml

          # Run enforce - should fail (exit 1) because password is not secured
          ! node dist/bin/mule-build.js enforce -d test-project2/src/main/mule

  sample-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17 and Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build mule-build
        run: |
          npm ci
          npm run build

      - name: Validate the sample Orders System API
        run: |
          SAMPLE=examples/sample-orders-system-api
          node dist/bin/mule-build.js -C "$SAMPLE" doctor --operation build
          node dist/bin/mule-build.js -C "$SAMPLE" doctor --operation test
          node dist/bin/mule-build.js -C "$SAMPLE" enforce
          node dist/bin/mule-build.js -C "$SAMPLE" test | tee sample-test-output.txt
          grep -E 'Tests passed: 1 run, 0 failures, 0 errors, 0 skipped' sample-test-output.txt
          node dist/bin/mule-build.js -C "$SAMPLE" package | tee sample-package-output.txt
          grep -E 'Package built successfully' sample-package-output.txt
          test "$(find "$SAMPLE/target" -maxdepth 1 -name 'sample-orders-system-api-*.jar' | wc -l | tr -d ' ')" -ge 1

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Build the documentation site
        # --strict turns a broken cross-link, missing anchor, or page left out of
        # the nav into a failure here rather than a warning in the deploy run.
        run: |
          pip install -r requirements-docs.txt
          mkdocs build --strict
